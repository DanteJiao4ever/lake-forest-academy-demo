name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        env:
          LFA_API_ORIGIN: ${{ vars.LFA_API_ORIGIN }}
          LFA_API_HEALTH_PATH: ${{ vars.LFA_API_HEALTH_PATH }}
          LFA_API_UPLOAD_HEALTH_PATH: ${{ vars.LFA_API_UPLOAD_HEALTH_PATH }}
          LFA_WORKSPACE_AUTH_HEALTH_PATH: ${{ vars.LFA_WORKSPACE_AUTH_HEALTH_PATH }}
          LFA_API_HEALTH_TIMEOUT_MS: ${{ vars.LFA_API_HEALTH_TIMEOUT_MS }}
          LFA_GOOGLE_AUTH_START: ${{ vars.LFA_GOOGLE_AUTH_START }}
          LFA_DRIVE_SYNC_PATH: ${{ vars.LFA_DRIVE_SYNC_PATH }}
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        id: upload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy uploaded Pages artifact
        id: deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        with:
          script: |
            const artifact = Number(process.env.PAGES_ARTIFACT_ID);
            if (!Number.isSafeInteger(artifact) || artifact < 1) {
              throw new Error("The Pages uploader returned no valid artifact ID.");
            }
            const token = await core.getIDToken();
            core.setSecret(token);
            let deployment;
            try {
              const response = await github.request("POST /repos/{owner}/{repo}/pages/deployments", {
                ...context.repo,
                artifact_id: artifact,
                pages_build_version: context.sha,
                oidc_token: token
              });
              deployment = response.data;
            } catch (error) {
              throw new Error(`Creating the Pages deployment failed (HTTP ${error.status || "unknown"}).`);
            }
            const id = deployment.id || deployment.status_url?.split("/").pop();
            if (!id) throw new Error("The Pages API returned no deployment ID.");
            const failures = new Set(["deployment_failed", "deployment_content_failed", "deployment_cancelled", "deployment_lost"]);
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              let status;
              try {
                const response = await github.request("GET /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}", {
                  ...context.repo,
                  pages_deployment_id: id
                });
                status = response.data.status;
              } catch (error) {
                if (error.status === 404 || error.status === 429 || error.status >= 500) continue;
                throw error;
              }
              if (status === "succeed") {
                core.setOutput("page_url", deployment.page_url);
                return;
              }
              if (failures.has(status)) throw new Error(`Pages deployment ${id}: ${status}`);
            }
            throw new Error(`Timed out waiting for Pages deployment ${id}.`);
